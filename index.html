<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Локальный трекер подписок с живыми пузырьками">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>SubBubble</title>
</head>
<body>
  <main class="app-shell">
    <section id="bubbles-screen" class="screen active" aria-labelledby="summary-title">
      <header class="summary">
        <div>
          <p class="eyebrow">SUBBUBBLE</p>
          <h1 id="summary-title"><span id="monthly-total">0 ₽</span><small>/ месяц</small></h1>
          <p id="yearly-total" class="year-total">0 ₽ в год</p>
        </div>
        <button id="rate-button" class="rate-pill" type="button" aria-label="Изменить курсы валют">Курсы · <span id="rate-value">$ 90 ₽</span><small id="rate-meta">авто</small></button>
      </header>
      <div id="bubble-world" class="bubble-world" aria-label="Интерактивные пузырьки подписок"></div>
      <p class="gesture-hint">Тяни и бросай пузырьки</p>
    </section>

    <section id="list-screen" class="screen" aria-labelledby="list-title">
      <header class="list-header">
        <div><p class="eyebrow">ВАШИ РАСХОДЫ</p><h2 id="list-title">Подписки</h2></div>
        <div class="list-actions">
          <button id="sync-indicator" class="sync-pill" type="button" aria-label="Синхронизировать сейчас" onclick="syncNow()"><span id="sync-label" class="sync-status">Ожидает синхронизации</span><small id="sync-last-time">ещё не было</small></button>
          <button id="add-button" class="add-button" type="button" aria-label="Добавить подписку">+</button>
        </div>
      </header>
      <div id="subscription-list" class="subscription-list"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button class="nav-button active" data-screen="bubbles-screen" type="button"><span class="nav-icon">◉</span><span>Пузыри</span></button>
    <button class="nav-button" data-screen="list-screen" type="button"><span class="nav-icon">≡</span><span>Список</span></button>
  </nav>

  <dialog id="editor-dialog" class="sheet">
    <form id="subscription-form" method="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><h3 id="editor-title">Новая подписка</h3><button class="icon-button" value="cancel" type="button" data-close>×</button></div>
      <input id="subscription-id" type="hidden">
      <label>Название<input id="name" required maxlength="40" placeholder="Например, Netflix"></label>
      <div class="form-row">
        <label>Сумма<input id="amount" required type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="499"></label>
        <label>Валюта<select id="currency"><option value="RUB">RUB ₽</option><option value="USD">USD $</option><option value="TRY">TRY ₺</option><option value="SGD">SGD S$</option></select></label>
      </div>
      <label>Период<select id="period"><option value="month">Ежемесячно</option><option value="year">Ежегодно</option></select></label>
      <label>Следующий платёж <span class="optional">необязательно</span><input id="next-payment" type="date"></label>
      <label>Категория <span class="optional">необязательно</span><input id="category" maxlength="30" placeholder="Работа, связь, развлечения"></label>
      <button class="primary-button" type="submit">Сохранить</button>
      <button id="delete-button" class="danger-button hidden" type="button">Удалить подписку</button>
    </form>
  </dialog>

  <dialog id="rate-dialog" class="sheet compact">
    <form id="rate-form" method="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><h3>Курс валют</h3><button class="icon-button" value="cancel" type="button" data-close>×</button></div>
      <p class="sheet-copy">Авто-курсы обновляются из интернета и остаются сохранёнными офлайн. Ручные курсы можно включить как override.</p>
      <label class="toggle-row"><span>Автоматические курсы</span><input id="rates-mode" type="checkbox" checked></label>
      <p id="rates-updated" class="sheet-copy small-copy">Авто ещё не обновлялось</p>
      <label>1 USD в рублях<input id="usd-rate" required type="number" min="0.01" step="0.01" inputmode="decimal"></label>
      <label>1 TRY в рублях<input id="try-rate" required type="number" min="0.01" step="0.01" inputmode="decimal"></label>
      <label>1 SGD в рублях<input id="sgd-rate" required type="number" min="0.01" step="0.01" inputmode="decimal"></label>
      <button id="refresh-rates-button" class="secondary-button" type="button">Обновить сейчас</button>
      <button class="primary-button" type="submit">Сохранить курсы</button>
    </form>
  </dialog>
  <script src="./sync-config.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
